name: Weekly Job Search Workflow

on:
  schedule:
    # 毎週月曜日 03:00 (JST では 12:00 頃)
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      limit:
        description: "企業ごとの記事取得上限"
        required: false
      recencyDays:
        description: "記事の新しさ（日数）"
        required: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest

    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_ROOT_PAGE_ID: ${{ secrets.NOTION_ROOT_PAGE_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      DEFAULT_LIMIT: ${{ vars.DEFAULT_LIMIT || '3' }}
      DEFAULT_RECENCY_DAYS: ${{ vars.DEFAULT_RECENCY_DAYS || '300' }}
      WORKFLOW_LIMIT: ${{ github.event.inputs.limit }}
      WORKFLOW_RECENCY_DAYS: ${{ github.event.inputs.recencyDays }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run workflow
        run: npm run workflow:run
